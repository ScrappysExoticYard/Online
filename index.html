<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrappy's Exotic Yard Online</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;700;800&family=Courier+Prime:wght@400;700&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="index-styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <header>
    <div class="logo-mark">Scrappy's</div>
    <div class="header-main">
      <h1>Exotic <span>Yard</span></h1>
      <div class="header-sub">Bearded Dragon Breeding Tools</div>
    </div>
    <div class="header-badge">Online</div>
    <div class="color-toggle">
      <span class="toggle-label">Dark Mode</span>
      <div id="color-toggle" class="toggle-switch" onclick="toggleColorScheme()"></div>
    </div>
  </header>

  <nav>
    <a href="index.html" class="active">Genetics Calculator</a>
    <a href="terminologies.html">Terminologies</a>
  </nav>

  <div class="app-container">
    <div class="parents-grid">
      <div class="parent-column">
        <div class="parent-panel">
          <div class="panel-title">Sire (♂)</div>
          <div class="form-group">
            <label for="sire-name">Sire Name</label>
            <input type="text" id="sire-name" placeholder="e.g., Zeus">
          </div>
          <div id="sire-genes"></div>
        </div>

        <div class="parent-panel">
          <div class="panel-title">Sire's Father (Paternal Grandfather)</div>
          <div class="form-group">
            <label for="sgf-name">Name (Optional)</label>
            <input type="text" id="sgf-name" placeholder="e.g., Titan">
          </div>
          <div id="sgf-genes"></div>
        </div>

        <div class="parent-panel">
          <div class="panel-title">Sire's Mother (Paternal Grandmother)</div>
          <div class="form-group">
            <label for="sgm-name">Name (Optional)</label>
            <input type="text" id="sgm-name" placeholder="e.g., Aurora">
          </div>
          <div id="sgm-genes"></div>
        </div>
      </div>

      <div class="parent-column">
        <div class="parent-panel">
          <div class="panel-title">Dam (♀)</div>
          <div class="form-group">
            <label for="dam-name">Dam Name</label>
            <input type="text" id="dam-name" placeholder="e.g., Athena">
          </div>
          <div id="dam-genes"></div>
        </div>

        <div class="parent-panel">
          <div class="panel-title">Dam's Father (Maternal Grandfather)</div>
          <div class="form-group">
            <label for="dgf-name">Name (Optional)</label>
            <input type="text" id="dgf-name" placeholder="e.g., Apollo">
          </div>
          <div id="dgf-genes"></div>
        </div>

        <div class="parent-panel">
          <div class="panel-title">Dam's Mother (Maternal Grandmother)</div>
          <div class="form-group">
            <label for="dgm-name">Name (Optional)</label>
            <input type="text" id="dgm-name" placeholder="e.g., Luna">
          </div>
          <div id="dgm-genes"></div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:24px">
      <button class="btn btn-primary" onclick="simulate()">⚙️ Calculate Results</button>
      <button class="btn btn-secondary" id="btn-export-png" onclick="exportToPNG()">⬇ Export PNG</button>
    </div>

    <div id="results-container"></div>
  </div>

  <script src="shared.js"></script>
  <script src="index.js"></script>
</body>
</html>
